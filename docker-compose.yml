services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ascentio}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      # Lidas pelo script em ./postgres-init na primeira subida (volume vazio)
      # para provisionar o banco/usuário do Libredesk.
      LIBREDESK_DB_NAME: ${LIBREDESK_DB_NAME:-libredesk}
      LIBREDESK_DB_USER: ${LIBREDESK_DB_USER:-libredesk_user}
      LIBREDESK_DB_PASSWORD: ${LIBREDESK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=100
      -c log_min_duration_statement=1000
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-ascentio}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Libredesk — help desk self-hosted (módulo support/ do backend).
  # Provisionamento de agente/role/inbox/webhook: ../backend/scripts/libredesk-setup.sh
  # (rodar via túnel SSH até LIBREDESK_PORT, depois do primeiro `up`).
  # Bootstrap: o `command` roda `--install --idempotent-install` + `--upgrade`
  # a cada subida, então `docker compose up -d libredesk` já basta.
  libredesk:
    image: libredesk/libredesk:v2.8.0
    environment:
      LIBREDESK_SYSTEM_USER_PASSWORD: ${LIBREDESK_SYSTEM_USER_PASSWORD}
      # Overrides de config.toml via env (prefixo LIBREDESK_ + `__` para
      # chaves aninhadas) — mantém segredos fora do arquivo versionado.
      LIBREDESK_APP__ENCRYPTION_KEY: ${LIBREDESK_ENCRYPTION_KEY}
      LIBREDESK_DB__USER: ${LIBREDESK_DB_USER:-libredesk_user}
      LIBREDESK_DB__PASSWORD: ${LIBREDESK_DB_PASSWORD}
      LIBREDESK_DB__DATABASE: ${LIBREDESK_DB_NAME:-libredesk}
    volumes:
      - ./libredesk/config.toml:/libredesk/config.toml:ro
      - libredesk_uploads:/libredesk/uploads
    command:
      - sh
      - -c
      - "./libredesk --install --idempotent-install --yes --config /libredesk/config.toml && ./libredesk --upgrade --yes --config /libredesk/config.toml && ./libredesk --config /libredesk/config.toml"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    # Também roteado publicamente via suporte.ascentio.com.br (nginx/conf.d),
    # além de acessível do host via loopback, para rodar
    # ../backend/scripts/libredesk-setup.sh ou abrir a UI via túnel SSH:
    # ssh -L 9000:localhost:${LIBREDESK_PORT:-9000} <host>
    ports:
      - "127.0.0.1:${LIBREDESK_PORT:-9000}:9000"

  backend-a:
    image: ${REGISTRY}ascend-backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ../ascend-backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-ascentio}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      JWT_REMEMBER_ME_SECRET: ${JWT_REMEMBER_ME_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_COACH_BASE: ${STRIPE_PRICE_COACH_BASE:-}
      STRIPE_PRICE_COACH_EXTRA: ${STRIPE_PRICE_COACH_EXTRA:-}
      STRIPE_PRICE_STANDALONE: ${STRIPE_PRICE_STANDALONE:-}
      LIBREDESK_BASE_URL: http://libredesk:9000
      LIBREDESK_API_KEY: ${LIBREDESK_API_KEY}
      LIBREDESK_API_SECRET: ${LIBREDESK_API_SECRET}
      LIBREDESK_INBOX_ID: ${LIBREDESK_INBOX_ID}
      LIBREDESK_WEBHOOK_SECRET: ${LIBREDESK_WEBHOOK_SECRET}
      LIBREDESK_TENANT_ATTR: ${LIBREDESK_TENANT_ATTR:-tenant}
      LIBREDESK_FETCH_TIMEOUT_MS: ${LIBREDESK_FETCH_TIMEOUT_MS:-15000}
      SLACK_SUPPORT_WEBHOOK_URL: ${SLACK_SUPPORT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@ascentio.com.br}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.ascentio.com.br}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      libredesk:
        condition: service_started
    networks:
      - internal
      - observability
    restart: unless-stopped
  backend-b:
    image: ${REGISTRY}ascend-backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ../ascend-backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-ascentio}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      JWT_REMEMBER_ME_SECRET: ${JWT_REMEMBER_ME_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_COACH_BASE: ${STRIPE_PRICE_COACH_BASE:-}
      STRIPE_PRICE_COACH_EXTRA: ${STRIPE_PRICE_COACH_EXTRA:-}
      STRIPE_PRICE_STANDALONE: ${STRIPE_PRICE_STANDALONE:-}
      LIBREDESK_BASE_URL: http://libredesk:9000
      LIBREDESK_API_KEY: ${LIBREDESK_API_KEY}
      LIBREDESK_API_SECRET: ${LIBREDESK_API_SECRET}
      LIBREDESK_INBOX_ID: ${LIBREDESK_INBOX_ID}
      LIBREDESK_WEBHOOK_SECRET: ${LIBREDESK_WEBHOOK_SECRET}
      LIBREDESK_TENANT_ATTR: ${LIBREDESK_TENANT_ATTR:-tenant}
      LIBREDESK_FETCH_TIMEOUT_MS: ${LIBREDESK_FETCH_TIMEOUT_MS:-15000}
      SLACK_SUPPORT_WEBHOOK_URL: ${SLACK_SUPPORT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@ascentio.com.br}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.ascentio.com.br}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      libredesk:
        condition: service_started
    networks:
      - internal
      - observability
    restart: unless-stopped

  frontend-web:
    image: ${REGISTRY}ascend-frontend:${FRONTEND_IMAGE_TAG:-latest}
    build:
      context: ../ascend-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_AUTH_URL: https://app.ascentio.com.br
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal
    restart: unless-stopped
  frontend-web-b:
    image: ${REGISTRY}ascend-frontend:${FRONTEND_IMAGE_TAG:-latest}
    build:
      context: ../ascend-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_AUTH_URL: https://app.ascentio.com.br
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - backend-a
      - backend-b
      - frontend-web
      - frontend-web-b
    networks:
      - internal
      - observability
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
  libredesk_uploads:

networks:
  internal:
    driver: bridge

include:
  - path: ./observability/docker-compose.yml
    env_file: ./observability/.env
