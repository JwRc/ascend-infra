# Config do Libredesk para staging/produção (docker-compose).
# Base: docker/libredesk/config.toml do backend (dev), com os segredos
# removidos daqui e injetados via env var no docker-compose.yml (overrides
# usam o prefixo LIBREDESK_ e `__` para chaves aninhadas — ver comentários
# abaixo em cada campo que foi deixado em branco de propósito).
# https://docs.libredesk.io/getting-started/installation
[app]
# Log level: info, debug, warn, error, fatal
log_level = "info"
# Environment: dev, prod. "prod" desliga o color logging de terminal.
env = "prod"
# Verificação de novas versões (mostra um banner no admin panel) — off por
# padrão pra não depender de uma chamada de rede de saída na inicialização.
check_updates = false
# Encryption key (32 caracteres hex) — NÃO fica hardcoded aqui. Injetada via
# LIBREDESK_APP__ENCRYPTION_KEY (docker-compose.yml lê de infra/.env, gerada
# com `openssl rand -hex 16`).
encryption_key = ""

# HTTP server.
[app.server]
# Address to bind the HTTP server to.
address = "0.0.0.0:9000"
# Unix socket path (leave empty to use TCP address instead)
socket = ""
# Cookies seguras (Secure flag) — mantido habilitado, o nginx termina TLS
# na frente e só ele fala com o Libredesk dentro da rede interna do compose.
disable_secure_cookies = false
# Session lifetime duration.
session_lifetime = "9h"
# Request read and write timeouts.
read_timeout = "60s"
write_timeout = "60s"
# Maximum request body size in bytes (100MB)
max_body_size = 104857600
# Size of the read buffer for incoming requests (also limits max header size).
read_buffer_size = 65536
# Keepalive settings.
keepalive_timeout = "10s"

# File upload provider to use, either `fs` or `s3`.
[upload]
provider = "fs"

# Filesystem provider — volume `libredesk_uploads` (ver docker-compose.yml).
[upload.fs]
upload_path = 'uploads'
# Signed URL expiry duration (e.g., "30m", "1h"). Defaults to 1h if unset.
expiry = "1h"

# S3 provider (não usado — provider="fs" acima). Preenchido só se migrar
# uploads para S3/MinIO no futuro.
[upload.s3]
url = ""
access_key = ""
secret_key = ""
region = "ap-south-1"
bucket = "bucket-name"
bucket_path = ""
expiry = "30m"

# Postgres — banco `libredesk` no Postgres compartilhado do compose (serviço
# `postgres`). Usuário/senha/nome do banco NÃO ficam hardcoded aqui — vêm de
# LIBREDESK_DB__USER / LIBREDESK_DB__PASSWORD / LIBREDESK_DB__DATABASE
# (docker-compose.yml, lidos de infra/.env).
[db]
host = "postgres"
port = 5432
user = ""
password = ""
database = ""
# "disable" é seguro aqui: a conexão fica inteiramente dentro da rede
# `internal` do compose (bridge isolada), sem sair do host — mesmo padrão já
# usado pela DATABASE_URL do backend para esse Postgres.
ssl_mode = "disable"
max_open = 10
max_idle = 10
max_lifetime = "300s"

# Redis — serviço `redis` do compose, database 1 (o backend usa a 0). Sem
# autenticação, mesmo padrão do restante desta infra (rede interna isolada,
# sem exposição externa — ver redis/redis.conf).
[redis]
address = "redis:6379"
user = ""
password = ""
db = 1

[message]
outgoing_queue_workers = 10
incoming_queue_workers = 10
message_outgoing_scan_interval = "50ms"
incoming_queue_size = 5000
outgoing_queue_size = 5000

[notification]
concurrency = 2
queue_size = 2000

[automation]
worker_count = 10

[ai_agent]
worker_count = 10
queue_size = 1000
max_steps = 6
max_history_messages = 30

[autoassigner]
autoassign_interval = "5m"

[webhook]
workers = 5
queue_size = 10000
timeout = "15s"

# SSRF guard para URLs configuradas por admin (webhooks, OIDC, provedores de
# IA). Desligado: este é um deploy self-hosted single-tenant — quem configura
# webhooks/integrações é a própria Ascentio, não tenants não confiáveis.
[ssrf]
enabled = false
allowed_cidrs = []

[conversation]
unsnooze_interval = "5m"
draft_retention_duration = "360h"
continuity_scan_interval = "5m"

[sla]
evaluation_interval = "5m"

# Per-IP rate limits (requests/min) para endpoints não autenticados. Nginx
# encaminha o IP real via X-Client-IP (ver nginx/conf.d/default.conf) para
# esses limites baterem no visitante, não no container do nginx.
[rate_limit.widget]
enabled = true
requests_per_minute = 100

[rate_limit.auth]
enabled = true
requests_per_minute = 30

[rate_limit.public]
enabled = true
requests_per_minute = 100

[rate_limit.media]
enabled = true
requests_per_minute = 300
